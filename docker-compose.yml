services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - CORS_ORIGINS=http://localhost,http://localhost:8080
      - DATABASE_URL=sqlite:////app/state/predictions.db
    volumes:
      - backend-state:/app/state

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-state:
